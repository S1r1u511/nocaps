<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="theme-color" content="#1d1033">
	<meta name="description" content="NOCAPS — play for your community.">
	<title>NOCAPS</title>
	<link rel="icon" type="image/png" href="icon.png">
	<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
	<script>
		// Hosted Firebase default domains redirect to the platform domain.
		// Only the top window redirects; the game iframe is left alone.
		(function () {
			if (window.top !== window.self) return;
			var host = location.hostname;
			if (/(^|\.)web\.app$/.test(host) || /(^|\.)firebaseapp\.com$/.test(host)) {
				location.replace("https://play.nocaps.fun" + location.pathname + location.search + location.hash);
			}
		}());
	</script>
	<style>
		:root {
			--ink: #1d1033;
			--gold: #ffd23f;
			--cream: #fff4dc;
			--lilac: #b9a8d6;
			--coral: #ff8a7a;
		}

		@font-face {
			font-family: "Fredoka";
			src: url("fredoka.ttf") format("truetype");
			font-weight: 300 700;
			font-display: swap;
		}

		* {
			box-sizing: border-box;
		}

		html, body, canvas {
			touch-action: none;
			overscroll-behavior: none;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			overflow: hidden;
			position: fixed;
			inset: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			margin: 0;
			background: var(--ink);
			color: var(--cream);
			font-family: "Fredoka", ui-rounded, "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		button {
			font-family: inherit;
		}

		/* --- game stage ----------------------------------------------------- */

		#backdrop {
			position: fixed;
			inset: 0;
			display: none;
			background: var(--ink) url("sunset.png") center / cover no-repeat;
		}

		#backdrop::after {
			content: "";
			position: absolute;
			inset: 0;
			background:
				radial-gradient(120% 90% at 50% 12%, rgba(29, 16, 51, 0.45), rgba(29, 16, 51, 0.86) 72%),
				linear-gradient(rgba(29, 16, 51, 0.55), rgba(29, 16, 51, 0.92));
		}

		/* Phone portrait: the game fills the screen. */
		#stage {
			position: fixed;
			inset: 0;
			overflow: hidden;
			background: var(--ink);
		}

		#game {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			background: var(--ink);
			touch-action: none;
		}

		/* Desktop/tablet: a centred 9:19.5 column with the backdrop around it. */
		@media (min-width: 600px) {
			#backdrop {
				display: block;
			}

			#stage {
				inset: auto;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: min(calc((100dvh - 32px) * 9 / 19.5), calc(100vw - 32px));
				height: auto;
				aspect-ratio: 9 / 19.5;
				border-radius: 40px;
				/* The frame is drawn with shadows so the content box keeps the ratio. */
				box-shadow:
					0 0 0 10px var(--ink),
					0 0 0 13px rgba(255, 244, 220, 0.16),
					0 34px 90px rgba(0, 0, 0, 0.55);
			}
		}

		@media (min-width: 600px) and (max-height: 460px) {
			#stage {
				width: min(calc((100vh - 28px) * 9 / 19.5), calc(100vw - 28px));
			}
		}

		/* --- loader --------------------------------------------------------- */

		#intro {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			padding: max(18px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom));
			background:
				radial-gradient(90% 58% at 50% 112%, rgba(255, 138, 122, 0.5), transparent 62%),
				radial-gradient(80% 55% at 14% 2%, rgba(185, 168, 214, 0.26), transparent 62%),
				radial-gradient(64% 46% at 90% 6%, rgba(255, 210, 63, 0.14), transparent 60%),
				linear-gradient(180deg, #1d1033 0%, #251540 40%, #33205a 64%, #4a2a63 82%, #7c3f68 100%);
			transition: opacity 0.6s ease, visibility 0.6s ease;
		}

		#intro.started {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		.intro-inner {
			position: relative;
			width: min(88vw, 420px);
			max-height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
			gap: clamp(12px, 2.4vh, 22px);
		}

		.intro-wordmark {
			margin: 0;
			font-size: clamp(46px, 13.5vw, 78px);
			font-weight: 600;
			letter-spacing: 0.5px;
			line-height: 0.95;
			color: var(--cream);
			text-shadow:
				0 5px 0 var(--ink),
				7px 7px 0 var(--ink),
				4px 4px 0 var(--ink),
				-4px 4px 0 var(--ink),
				4px -4px 0 var(--ink),
				-4px -4px 0 var(--ink),
				0 4px 0 var(--ink),
				0 -4px 0 var(--ink),
				4px 0 0 var(--ink),
				-4px 0 0 var(--ink);
		}

		.intro-wordmark .caps {
			color: var(--gold);
		}

		.intro-tagline {
			margin: 0;
			font-size: clamp(16px, 4.4vw, 21px);
			font-weight: 500;
			line-height: 1.2;
			color: var(--cream);
			text-shadow:
				2px 2px 0 var(--ink),
				1px 1px 0 var(--ink),
				-1px 1px 0 var(--ink),
				1px -1px 0 var(--ink),
				-1px -1px 0 var(--ink);
		}

		/* Rotating "coming soon" line. */
		.soon {
			position: relative;
			margin: 0;
			width: 100%;
			height: 1.6em;
			font-size: clamp(15px, 4vw, 19px);
			font-weight: 500;
			color: var(--gold);
		}

		.soon span {
			position: absolute;
			left: 0;
			right: 0;
			top: 0;
			opacity: 0;
			animation: soonCycle 9s linear infinite;
			text-shadow:
				2px 2px 0 var(--ink),
				1px 1px 0 var(--ink),
				-1px 1px 0 var(--ink),
				1px -1px 0 var(--ink),
				-1px -1px 0 var(--ink);
		}

		.soon span:nth-child(2) { animation-delay: 3s; }
		.soon span:nth-child(3) { animation-delay: 6s; }

		@keyframes soonCycle {
			0% { opacity: 0; transform: scale(0.94); }
			4% { opacity: 1; transform: scale(1); }
			29% { opacity: 1; transform: scale(1); }
			33% { opacity: 0; }
			100% { opacity: 0; }
		}

		/* --- loading + play ------------------------------------------------- */

		.loader {
			display: none;
			width: min(100%, 320px);
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}

		#intro.loading .loader {
			display: flex;
		}

		.bar {
			display: block;
			width: 100%;
			height: 16px;
			border: 4px solid var(--ink);
			border-radius: 999px;
			background: rgba(255, 244, 220, 0.12);
			box-shadow: 0 5px 0 var(--ink);
			overflow: hidden;
		}

		.fill {
			display: block;
			width: 0%;
			height: 100%;
			border-radius: 999px;
			background: var(--gold);
			transition: width 0.25s ease;
		}

		.loadlabel {
			margin: 0;
			font-size: clamp(15px, 4vw, 18px);
			font-weight: 500;
			color: var(--cream);
			text-shadow:
				2px 2px 0 var(--ink),
				1px 1px 0 var(--ink),
				-1px 1px 0 var(--ink),
				1px -1px 0 var(--ink),
				-1px -1px 0 var(--ink);
		}

		#play {
			display: flex;
			align-items: center;
			justify-content: center;
			width: min(100%, 320px);
			min-height: clamp(62px, 16vw, 78px);
			padding: 8px 18px;
			border: 4px solid var(--ink);
			border-radius: 22px;
			background: var(--gold);
			color: var(--ink);
			font-size: clamp(20px, 5.6vw, 28px);
			font-weight: 700;
			letter-spacing: 0.5px;
			box-shadow: 0 7px 0 var(--ink);
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
			transition: transform 0.12s ease, box-shadow 0.12s ease;
		}

		#play:active:not(:disabled) {
			transform: translateY(4px);
			box-shadow: 0 3px 0 var(--ink);
		}

		#play:focus-visible {
			outline: 4px solid var(--cream);
			outline-offset: 3px;
		}

		#intro.loading #play,
		#intro.error #play {
			display: none;
		}

		#intro.ready #play {
			animation: ctaPulse 1.9s ease-in-out infinite;
		}

		@keyframes ctaPulse {
			0%, 100% { transform: scale(1); }
			50% { transform: scale(1.03); }
		}

		.hint {
			margin: 0;
			font-size: clamp(14px, 3.8vw, 17px);
			font-weight: 500;
			color: var(--coral);
			text-shadow:
				2px 2px 0 var(--ink),
				1px 1px 0 var(--ink),
				-1px 1px 0 var(--ink),
				1px -1px 0 var(--ink),
				-1px -1px 0 var(--ink);
		}

		.hint[hidden] {
			display: none;
		}

		#retry {
			margin-left: 6px;
			padding: 4px 14px;
			border: 3px solid var(--ink);
			border-radius: 12px;
			background: var(--cream);
			color: var(--ink);
			font-size: inherit;
			font-weight: 700;
			cursor: pointer;
			box-shadow: 0 3px 0 var(--ink);
		}

		#retry:active {
			transform: translateY(2px);
			box-shadow: 0 1px 0 var(--ink);
		}

		@media (prefers-reduced-motion: reduce) {
			.soon span,
			#intro.ready #play {
				animation: none !important;
			}

			.soon span:first-child {
				opacity: 1;
			}
		}
	</style>
</head>
<body>
	<div id="backdrop" aria-hidden="true"></div>
	<main id="layout">
		<div id="stage">
			<iframe id="game" src="game/index.html" title="NOCAPS" loading="eager" allow="autoplay; fullscreen; gamepad; web-share"></iframe>
		</div>
	</main>

	<section id="intro" aria-label="NOCAPS">
		<div class="intro-inner">
			<h1 class="intro-wordmark">NO<span class="caps">CAPS</span></h1>
			<p class="intro-tagline">Play for your community</p>

			<p class="soon" aria-live="polite">
				<span>Early Beta · crews &amp; daily boards</span>
				<span>Crew rewards · not live yet</span>
				<span>Caps collection · not live yet</span>
			</p>

			<div class="loader" id="loader">
				<span class="bar"><span class="fill" id="fill"></span></span>
				<span class="loadlabel" id="loadlabel">Loading…</span>
			</div>

			<button id="play" type="button" onclick="window.nocapsStart()">PLAY THE BETA</button>

			<p class="hint" id="hint" hidden>Couldn’t load the game. <button id="retry" type="button">Retry</button></p>
		</div>
	</section>

	<noscript><style>#intro { display: none; }</style></noscript>

	<script>
		"use strict";

		// Minimal start handler, defined before anything else so the button and
		// game keep working even if the progress code below fails.
		window.nocapsStart = function () {
			var intro = document.getElementById("intro");
			if (!intro || intro.classList.contains("started")) {
				return;
			}
			intro.classList.add("started");
			var game = document.getElementById("game");
			if (game) {
				try {
					game.focus();
					if (game.contentWindow) game.contentWindow.focus();
					var canvas = game.contentDocument && game.contentDocument.getElementById("canvas");
					if (canvas && canvas.focus) canvas.focus();
				} catch (error) { /* cross-document focus is best effort */ }
			}
			window.setTimeout(function () {
				intro.style.display = "none";
			}, 700);
		};

		(function () {
			function stopDefault(event) {
				event.preventDefault();
			}

			["touchmove", "gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
				document.addEventListener(name, stopDefault, { passive: false });
			});

			var game = document.getElementById("game");
			var intro = document.getElementById("intro");
			var play = document.getElementById("play");
			var fill = document.getElementById("fill");
			var loadLabel = document.getElementById("loadlabel");
			var hint = document.getElementById("hint");
			var retry = document.getElementById("retry");

			// Same-origin lock inside the game document (belt and braces with the
			// engine's own touch-action rules).
			function lockGameDocument() {
				var doc;
				try {
					doc = game.contentDocument;
				} catch (error) {
					return;
				}
				if (!doc || !doc.head || doc.getElementById("nocaps-touch-lock")) return;
				var style = doc.createElement("style");
				style.id = "nocaps-touch-lock";
				style.textContent = [
					"html, body, canvas {",
					"  touch-action: none;",
					"  overscroll-behavior: none;",
					"  -webkit-user-select: none;",
					"  user-select: none;",
					"  -webkit-touch-callout: none;",
					"  overflow: hidden;",
					"  position: fixed;",
					"  inset: 0;",
					"}",
					"body { margin: 0; background: #1d1033; }"
				].join("\n");
				doc.head.appendChild(style);
				["touchmove", "gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
					doc.addEventListener(name, stopDefault, { passive: false });
				});
			}

			var awaitReload = false;

			function handleGameLoad() {
				awaitReload = false;
				lockGameDocument();
			}

			game.addEventListener("load", handleGameLoad);
			lockGameDocument();

			// --- engine progress gate --------------------------------------
			// Primary path: the /game page posts progress/ready/failure to us via
			// postMessage. A same-origin poll is kept as a fallback in case the
			// bridge is ever missing.
			var settled = false;
			var sawStatus = false;
			var gotMessage = false;
			var pollTimer = null;
			var fallbackTimer = null;
			var hardTimeout = null;

			function armTimeout() {
				if (hardTimeout) window.clearTimeout(hardTimeout);
				hardTimeout = window.setTimeout(function () {
					if (settled !== "ready") markFailed();
				}, 45000);
			}

			// The bar and the label are both driven by this one value.
			function setProgress(fraction) {
				if (settled) return;
				var pct = Math.max(0, Math.min(100, Math.round(fraction * 100)));
				loadLabel.textContent = pct > 0 ? "Loading " + pct + "%" : "Loading…";
				fill.style.width = pct + "%";
				armTimeout();
			}

			function markReady() {
				if (settled === "ready") return;
				settled = "ready";
				if (pollTimer) window.clearTimeout(pollTimer);
				if (fallbackTimer) window.clearTimeout(fallbackTimer);
				if (hardTimeout) window.clearTimeout(hardTimeout);
				hint.hidden = true;
				play.disabled = false;
				play.textContent = "PLAY THE BETA";
				intro.classList.remove("loading", "error");
				intro.classList.add("ready");
			}

			function markFailed() {
				if (settled === "ready" || settled === "error") return;
				settled = "error";
				if (pollTimer) window.clearTimeout(pollTimer);
				if (fallbackTimer) window.clearTimeout(fallbackTimer);
				if (hardTimeout) window.clearTimeout(hardTimeout);
				play.disabled = true;
				intro.classList.remove("loading", "ready");
				intro.classList.add("error");
				hint.hidden = false;
			}

			window.addEventListener("message", function (event) {
				if (!game || event.source !== game.contentWindow) return;
				var data = event.data;
				if (!data || typeof data.type !== "string") return;
				if (data.type === "nocaps-progress") {
					gotMessage = true;
					setProgress(Number(data.value) || 0);
				} else if (data.type === "nocaps-ready") {
					gotMessage = true;
					markReady();
				} else if (data.type === "nocaps-failure") {
					gotMessage = true;
					markFailed();
				}
			});

			function poll() {
				pollTimer = null;
				if (settled) return;
				if (awaitReload) {
					pollTimer = window.setTimeout(poll, 250);
					return;
				}
				try {
					var doc = game.contentDocument;
					if (doc) {
						var status = doc.getElementById("status");
						var canvas = doc.getElementById("canvas");
						if (status) sawStatus = true;
						if (status || canvas) {
							var notice = doc.getElementById("status-notice");
							if (notice && notice.style.display !== "none" && notice.textContent.trim()) {
								markFailed();
								return;
							}
							if (canvas && !status && (sawStatus || doc.readyState === "complete")) {
								markReady();
								return;
							}
							var progress = doc.getElementById("status-progress");
							if (status && progress) {
								var current = parseFloat(progress.value);
								var total = parseFloat(progress.max);
								if (current > 0 && total > 1) setProgress(current / total);
							}
						}
					}
				} catch (error) {
					// Cross-document reads can fail transiently; keep polling.
				}
				pollTimer = window.setTimeout(poll, 250);
			}

			function startLoading(force) {
				settled = false;
				sawStatus = false;
				gotMessage = false;
				play.disabled = true;
				fill.style.width = "0%";
				loadLabel.textContent = "Loading…";
				hint.hidden = true;
				intro.classList.remove("ready", "error");
				intro.classList.add("loading");
				if (force) {
					awaitReload = true;
					game.src = "game/index.html?reload=" + Date.now();
				}
				if (pollTimer) window.clearTimeout(pollTimer);
				if (fallbackTimer) window.clearTimeout(fallbackTimer);
				if (hardTimeout) window.clearTimeout(hardTimeout);
				// If no postMessage arrives, fall back to reading the iframe.
				fallbackTimer = window.setTimeout(function () {
					if (!gotMessage && !settled) poll();
				}, 3000);
				armTimeout();
			}

			game.addEventListener("error", markFailed);
			retry.addEventListener("click", function () {
				startLoading(true);
			});

			try {
				startLoading(false);
			} catch (error) {
				// If progress wiring fails, leave the button usable so the game
				// still opens once its iframe finishes loading.
				if (window.console && console.warn) console.warn("NOCAPS loader init failed:", error);
				play.disabled = false;
				intro.classList.remove("loading");
			}
		}());
	</script>
</body>
</html>
